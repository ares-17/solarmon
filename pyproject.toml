[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# solarmon.py usa uno stile compatto voluto (istruzioni sulla stessa riga).
# Sono regole di forma, non di correttezza: i test restano sotto lint completo.
[tool.ruff.lint.per-file-ignores]
"solarmon.py" = ["E401", "E701", "E702", "E731", "I001"]
