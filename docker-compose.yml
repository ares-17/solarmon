services:
  solarmon:
    build: .
    image: solarmon:latest
    container_name: solarmon
    restart: unless-stopped
    # La Pi usa un resolver interno (systemd-resolved) che Docker scarta: senza upstream
    # espliciti il container resta con il solo 127.0.0.11 e Telegram fallisce con URLError
    # (gaierror -3, "Temporary failure in name resolution").
    # Se la rete blocca i DNS pubblici, sostituisci con l'IP del router o di Pi-hole.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8000:8000"
    # In alternativa al port-mapping, su Raspberry Pi con Tailscale è possibile usare la rete dell'host:
    # network_mode: host
    devices:
      - /dev/inverter:/dev/inverter
    volumes:
      # Persistenza database SQLite
      - ./data:/var/lib/solarmon
      # File di configurazione (opzionale se passato tramite env_file o environment)
      # - ./solarmon.env:/etc/solarmon.env:ro
    env_file:
      - path: solarmon.env
        required: false
    environment:
      - PORT=8000
      # Se si accede all'endpoint di debug /api/raw attraverso una porta esposta su rete non-loopback:
      # - RAW_TOKEN=tuo_token_segreto
